name: I3C CI
on:
  push:
    branches: ["main", "87005-public_ci", "gpla/ci-tests"]
  pull_request:
  workflow_dispatch:

jobs:
  verification_axi:
    name: Verification AXI
    runs-on: [ self-hosted, Linux, X64, gcp-custom-runners ]
    container: centos:8
    steps:
      - name: Get repository
        run: _secret_combined_i3c:27
        env:
          SECRET_NAME: _secret_custom_checkout
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SUBMODULES: RECURSIVE

      - name: Prepare env
        run: _secret_combined_i3c
        env:
          SECRET_NAME: _secret_i3c_platform_prepare
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify AXI
        run: _secret_combined_i3c
        env:
          SECRET_NAME: _secret_i3c_verify_axi
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: [ self-hosted, Linux, X64, gcp-custom-runners ]
    container: centos:8
    steps:
      - name: Get repository
        run: _secret_combined_i3c
        env:
          SECRET_NAME: _secret_custom_checkout
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SUBMODULES: RECURSIVE

      - name: Prepare env
        run: _secret_combined_i3c
        env:
          SECRET_NAME: _secret_i3c_platform_prepare
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: _secret_combined_i3c
        env:
          SECRET_NAME: _secret_i3c_lint
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  custom_lint:
    name: Custom Lint
    runs-on: [ self-hosted, Linux, X64, gcp-custom-runners ]
    container: centos:8
    env:
      GHA_EXTERNAL_DISK: caliptra-i3c-tools
    steps:
      - name: Get repository
        run: _secret_combined_i3c
        env:
          SECRET_NAME: _secret_custom_checkout
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SUBMODULES: RECURSIVE

      - name: Prepare env
        run: _secret_combined_i3c
        env:
          SECRET_NAME: _secret_i3c_platform_prepare
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decrypt tools
        run: _secret_combined_i3c
        env:
          SECRET_NAME: _secret_decrypt_tools
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VC_STATIC_KEY: ${{ secrets.VC_STATIC_KEY }}

      - name: Custom Lint
        run: _secret_combined_i3c
        env:
          SECRET_NAME: _secret_i3c_custom_lint
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  custom_axi_verification:
    name: Custom Axi Verification
    runs-on: [ self-hosted, Linux, X64, gcp-custom-runners ]
    container: centos:8
    env:
      GHA_EXTERNAL_DISK: caliptra-i3c-tools
    steps:
      - name: Get repository
        run: _secret_combined_i3c
        env:
          SECRET_NAME: _secret_custom_checkout
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SUBMODULES: RECURSIVE

      - name: Prepare env
        run: _secret_combined_i3c
        env:
          SECRET_NAME: _secret_i3c_platform_prepare
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decrypt tools
        run: _secret_combined_i3c
        env:
          SECRET_NAME: _secret_decrypt_tools
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCS_KEY: ${{ secrets.VCS_KEY }}

      - name: Custom Axi Verification
        run: _secret_combined_i3c
        env:
          CI_PARALLEL_INDEX: 1
          CI_PARALLEL_TOTAL: 1
          SECRET_NAME: _secret_i3c_custom_axi_test
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
