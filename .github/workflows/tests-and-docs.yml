name: Run Tests

on:
  push:
  workflow_dispatch:
  schedule:
    - cron:  '30 3 * * *' # Run everyday at 3:30AM

permissions:
  contents: write

jobs:

  coverage:
    name: Process Coverage
    runs-on: [ self-hosted, Linux, X64, gcp-custom-runners ]
    needs: [ custom_axi_verification, axi_verification ]
    container: antmicro/centos-dev-tools
    env:
      GHA_EXTERNAL_DISK: additional-tools-all
      GHA_SA: gh-sa-i3c-core-uploader
    steps:
      - name: Get repository
        run: _secret_custom_checkout:6
        env:
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SUBMODULES: RECURSIVE
      - name: Prepare platform
        run: _secret_i3c_platform_prepare:3
        env:
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Process Coverage
        run: _secret_i3c_process_coverage:1
        env:
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  custom_lint:
    name: Custom Lint
    runs-on: [ self-hosted, Linux, X64, gcp-custom-runners ]
    container: antmicro/centos-dev-tools
    env:
      GHA_EXTERNAL_DISK: additional-tools-all
      GHA_SA: gh-sa-i3c-core-uploader
    steps:
      - name: Get repository
        run: _secret_custom_checkout:6
        env:
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SUBMODULES: RECURSIVE
      - name: Custom Lint
        run: _secret_i3c_custom_lint:13
        env:
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  axi_verification:
    name: Axi Verification
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: "noninteractive"
    steps:
      - name: Install dependencies
        run: |
          sudo apt -qqy update
          sudo apt -qqy --no-install-recommends install help2man libfl-dev make g++ git bison flex gperf \
                                                        libreadline-dev libbz2-dev autoconf python3-sphinx \
                                                        python3-docopt

      - name: Setup repository
        uses: actions/checkout@v4

      - name: Get Submodules
        run: |
          git submodule update --init --recursive

      - name: Install Pyenv
        run: |
          ./install.sh

      - name: Build Icarus
        run: |
          git clone https://github.com/steveicarus/iverilog.git
          cd iverilog
          git checkout 06077ed026b4d8498d9129a6acfb0b44d0b51f18
          sh autoconf.sh
          ./configure
          make -j$(nproc)
          sudo make install
          iverilog -V

      - name: Build Verilator
        run: |
          git clone https://github.com/verilator/verilator -b v5.024
          cd verilator
          autoconf
          ./configure
          make -j$(nproc)
          sudo make install
          verilator --version

      - name: Run Tests
        run: |
          make install-uvm
          source activate.sh
          make tests-axi

      - name: Process coverage
        run: |
         source activate.sh
         python -m pip install -r requirements.txt
         python -m pip install git+https://github.com/antmicro/info-process.git
         mkdir -p artifacts/results
         source .venv/bin/activate

         COVERAGE_DIR="$(TMP="${CI_JOB_NAME////_}"; echo "artifacts/coverage/${TMP// /_}")"
         mkdir -p "${COVERAGE_DIR}"
         COVERAGE_DIR="$(realpath "${COVERAGE_DIR}")"
         (cd verification/cocotb && find -name \*.dat -not -name Vtop\*.dat | xargs cp -Lrv --parents -t "${COVERAGE_DIR}")

         for cov in $(find "${COVERAGE_DIR}" -type f -name \*.dat); do
          out_file="$(dirname "${cov}")/$(basename "${cov}" .dat)_verilator.info"
          verilator_coverage --skip-toggle --write-info "${out_file}" "${cov}"
          verilator_coverage --toggle-only --write-info "${out_file%%_all_verilator.info}_toggle_verilator.info" "${cov}"
          rm "${cov}"

          info-process extract --coverage-type line --output "${out_file%%_all_verilator.info}_line_verilator.info" "${out_file}"
          info-process extract --coverage-type cond --output "${out_file%%_all_verilator.info}_cond_verilator.info" "${out_file}"
          info-process extract --coverage-type branch --output "${out_file%%_all_verilator.info}_branch_verilator.info" "${out_file}"
          rm "${out_file}"
         done
         tar -c `find verification/cocotb -name \*.xml -o -name \*.log -o -name \*.info -o -name \*.vcd -o -name \*.dat -not -name Vtop*.dat` -f logs.tar
         cd artifacts/results
         tar xf ../../logs.tar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axi-verification
          path: artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tests-results
          path: verification/cocotb

  custom_axi_verification:
    name: Custom Axi Verification
    runs-on: [ self-hosted, Linux, X64, gcp-custom-runners ]
    container: antmicro/centos-dev-tools
    env:
      GHA_EXTERNAL_DISK: additional-tools-all
      GHA_SA: gh-sa-i3c-core-uploader
    steps:
      - name: Get repository
        run: _secret_custom_checkout:6
        env:
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SUBMODULES: RECURSIVE
      - name: Prepare platform
        run: _secret_i3c_platform_prepare:3
        env:
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Custom Axi Verification
        run: _secret_i3c_custom_axi_test:14
        env:
          SIM_RETRY_CONDITION: "Check your license file|Cannot connect to the license server|Failed to obtain license|License check .* failed"
          TEST_COVERAGE_ENABLE: 1
          CI_PARALLEL_INDEX: 1
          CI_PARALLEL_TOTAL: 1
          TEST_ITERATIONS: 1
          MAKE_TARGET: "tests-axi"
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-build:
    name: Documentation build
    runs-on: ubuntu-latest
    needs: [build-and-test, coverage]
    env:
      DEBIAN_FRONTEND: "noninteractive"
    steps:
      - name: Install dependencies
        run: |
          sudo apt -qqy update && sudo apt -qqy --no-install-recommends install \
            python3 python3-pip python3-venv git

      - name: Setup repository
        uses: actions/checkout@v4

      - name: Get Submodules
        run: |
          git submodule update --init --recursive

      - uses: actions/download-artifact@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          export I3C_ROOT_DIR="`pwd`"
          pip3 install -r requirements.txt
          pip3 install -r doc/requirements.txt

      - name: Generate VP
        run: |
          source .venv/bin/activate
          cp -r tests-results/* verification/cocotb/
          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME/" make verification-docs-with-sim

      - name: Build Docs
        run: |
          pushd doc
            pip3 install -r requirements.txt
            TZ=UTC make html
          popd
          ls -lah doc/build
          git clone https://github.com/antmicro/i3c-core-coverage-results || exit 0
          cp i3c-core-coverage-results/*html doc/build/html

      - name: Pack artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: ./doc/build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./doc/build/html
